name: Claude distribution packages

on:
  pull_request:
    paths:
      - integrations/**
      - skills/**
      - bin/**
      - LICENSE
      - scripts/package-claude.py
      - tests/claude-package.test.py
      - .github/workflows/claude-package.yml
  push:
    branches: [main]
    paths:
      - integrations/**
      - skills/**
      - bin/**
      - LICENSE
      - scripts/package-claude.py
      - tests/claude-package.test.py
      - .github/workflows/claude-package.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test package isolation and bundled bridge against local fixture
        run: python3 tests/claude-package.test.py
      - name: Build bounded plugin ZIP and private Desktop MCPB
        run: |
          python3 scripts/package-claude.py --kind plugin --output "$RUNNER_TEMP/magist-claude-plugin.zip"
          python3 scripts/package-claude.py --kind desktop --output "$RUNNER_TEMP/magist-desktop.mcpb"
